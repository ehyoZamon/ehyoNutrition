<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fruit Gradient -->
    <linearGradient id="plumGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9f27d"></stop>
      <stop offset="100%" stop-color="#7aa52d"></stop>
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4caf50"></stop>
      <stop offset="100%" stop-color="#1b5e20"></stop>
    </linearGradient>

    <!-- Soft Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#00000033"></feDropShadow>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="rgba(0,0,0,0)"></rect>

  <!-- Leaves -->
  <g filter="url(#shadow)">
    <ellipse cx="140" cy="160" rx="90" ry="35" transform="rotate(-20 140 160)" fill="url(#leafGradient)"></ellipse>

    <ellipse cx="250" cy="120" rx="100" ry="38" transform="rotate(8 250 120)" fill="url(#leafGradient)"></ellipse>

    <ellipse cx="370" cy="160" rx="90" ry="35" transform="rotate(18 370 160)" fill="url(#leafGradient)"></ellipse>
  </g>

  <!-- Branch -->
  <path d="M180 180 C240 200, 300 200, 350 180" stroke="#6d4c41" stroke-width="10" fill="none" stroke-linecap="round"></path>

  <!-- Whole Kakadu Plums -->
  <g filter="url(#shadow)">
    <ellipse cx="190" cy="280" rx="60" ry="90" transform="rotate(-10 190 280)" fill="url(#plumGradient)"></ellipse>

    <ellipse cx="320" cy="290" rx="60" ry="95" transform="rotate(12 320 290)" fill="url(#plumGradient)"></ellipse>

    <ellipse cx="255" cy="320" rx="55" ry="80" fill="url(#plumGradient)"></ellipse>
  </g>

  <!-- Highlights -->
  <ellipse cx="170" cy="245" rx="16" ry="34" transform="rotate(-10 170 245)" fill="#ffffff66"></ellipse>

  <ellipse cx="300" cy="255" rx="16" ry="34" transform="rotate(12 300 255)" fill="#ffffff66"></ellipse>

  <ellipse cx="240" cy="295" rx="14" ry="28" fill="#ffffff55"></ellipse>

  <!-- Cut Plum -->
  <g filter="url(#shadow)">
    <ellipse cx="160" cy="410" rx="85" ry="50" fill="#b8d96b"></ellipse>

    <ellipse cx="160" cy="410" rx="72" ry="40" fill="#eef6d5"></ellipse>

    <!-- Seed -->
    <ellipse cx="160" cy="410" rx="18" ry="42" fill="#c89b5d"></ellipse>
  </g>
</svg>